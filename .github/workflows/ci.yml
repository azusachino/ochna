name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Reads .mise.toml (rust = "stable"), the same file `make check`/`make
      # test` resolve against locally via `mise x --`, so CI and local dev
      # can't drift onto different toolchain versions.
      - name: Install mise-managed toolchain (rust)
        uses: jdx/mise-action@v2

      - name: Cache dependencies
        uses: swatinem/rust-cache@v2

      - name: Check formatting and lint
        run: make check

      - name: Run tests
        run: make test
