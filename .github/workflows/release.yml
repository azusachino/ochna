name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish-crates:
    name: Publish to Crates.io
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Publish package
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if curl -s -H "User-Agent: ochna-release-ci" "https://crates.io/api/v1/crates/ochna/${version}" | jq -e '.version.num' >/dev/null; then
            echo "ochna ${version} already on crates.io — skipping publish."
          else
            cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
          fi

  publish-github:
    name: Publish GitHub Release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact_name: ochna-macos-aarch64
            toolchain: stable-aarch64-apple-darwin
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            artifact_name: ochna-linux-x86_64
            toolchain: stable-x86_64-unknown-linux-gnu

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # macos-latest runners come with rustup pre-installed, so
      # dtolnay/rust-toolchain's own rustup-install step is skipped and it
      # only adds `targets:` as an extra cross-target -- it does not force
      # the *active* toolchain's host to match the runner's actual hardware.
      # If the pre-installed default toolchain's host was ever
      # x86_64-apple-darwin (e.g. a legacy image default) while the runner
      # hardware is arm64, build-script binaries (always host-compiled) come
      # out x86_64 and fail with "cannot execute binary file" -- GitHub's
      # arm64 macOS runners don't guarantee Rosetta 2 is installed. Pinning
      # `toolchain:` to the host-qualified name (not bare `stable`) forces
      # rustup to install/select a toolchain whose host actually matches the
      # runner, for both legs, rather than trusting an implicit default.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          targets: ${{ matrix.target }}

      # x86_64-unknown-linux-musl is the one real cross-compile here (glibc
      # host -> musl target); musl-tools gives rustc's own musl support a
      # working musl-gcc. aarch64-apple-darwin needs no cross toolchain at
      # all: the runner already is that architecture, so plain `cargo build`
      # links against the runner's actual, current Xcode SDK. This
      # deliberately avoids cargo-zigbuild/Zig on macOS: Zig ships its own
      # bundled macOS SDK stub libraries, which drift out of sync whenever
      # GitHub bumps the macos-latest image's real SDK version underneath a
      # pinned Zig release -- that drift silently broke every release build
      # from v0.0.5 through v0.3.1 with no change on our side to point at.
      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build release binary
        run: |
          cargo build --release --target ${{ matrix.target }}
          mkdir -p dist
          cp target/${{ matrix.target }}/release/ochna dist/${{ matrix.artifact_name }}

      - name: Upload binaries to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.artifact_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
